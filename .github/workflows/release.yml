name: release

# Manual only. A tag push that publishes a broken image is worse than a
# release that waits for a human, so the trigger stays a button until the
# pipeline has proven itself.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，形如 v0.1.0
        required: true
        type: string
      allow_overwrite:
        description: 允许覆盖已存在的镜像 tag（仅用于发布重试或回滚）
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/re0auth/re0auth
  CNB_IMAGE: docker.cnb.cool/r-0semi/re0auth

jobs:
  # The same gate main runs. A release that skipped a check would ship a
  # binary whose tests never ran.
  ci:
    uses: ./.github/workflows/ci.yml

  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A dispatch can run this file from any branch; the workflow file and the
      # version it validates then come from that branch. Only main may release.
      - name: require the default branch
        env:
          REF: ${{ github.ref }}
        run: |
          set -eu
          if [ "$REF" != "refs/heads/main" ]; then
            echo "release 只允许从 main 触发，当前为 $REF" >&2
            exit 1
          fi

      - name: check version format
        id: check
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          v="$INPUT_VERSION"
          # The input becomes an image tag; a malformed value must stop here
          # rather than after a twenty minute build.
          printf '%s' "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || {
            echo "版本号必须形如 v0.1.0，实际为: $v" >&2
            exit 1
          }
          # The tag is a promise about what the binary reports at runtime.
          declared=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p')
          if [ "v$declared" != "$v" ]; then
            echo "Cargo.toml 声明 $declared，与输入的 $v 不一致；请先修改 workspace.package.version" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # A source tag that points elsewhere means the version was reused; stop
      # before a twenty minute build, not after the images are already pushed.
      - name: refuse a source tag that points elsewhere
        env:
          VERSION: ${{ steps.check.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          err=$(mktemp)
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" \
              --jq '.object.type + " " + .object.sha' 2>"$err"); then
            object_type=${existing%% *}
            object_sha=${existing#* }
            if [ "$object_type" = "tag" ]; then
              object_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.object.sha')
            fi
            if [ "$object_sha" != "$GITHUB_SHA" ]; then
              echo "标签 $VERSION 已指向 $object_sha，而本次构建是 $GITHUB_SHA" >&2
              exit 1
            fi
          elif ! grep -q "HTTP 404" "$err"; then
            # 401/403/5xx/限流不再被当成「tag 不存在」。
            echo "查询标签失败（只有 404 视为不存在）：" >&2
            cat "$err" >&2
            exit 1
          fi

      # 同一个 vX.Y.Z 指向两份二进制时，升级与回滚都会失去意义：
      # 引用该版本的人拿到的内容取决于拉取时间。已存在的 tag 一律拒绝，
      # 只有显式勾选 allow_overwrite（发布重试/回滚）才放行。
      - name: refuse to reuse a published version
        if: ${{ !inputs.allow_overwrite }}
        env:
          VERSION: ${{ steps.check.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -eu
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          printf '%s' "$CNB_TOKEN" | docker login docker.cnb.cool -u cnb --password-stdin >/dev/null
          for image in "$GHCR_IMAGE" "$CNB_IMAGE"; do
            if docker buildx imagetools inspect "$image:$VERSION" >/dev/null 2>&1; then
              echo "$image:$VERSION 已存在；请提升 workspace.package.version" >&2
              exit 1
            fi
          done

  # One approval per release: the environment's deployment branch policy is
  # enforced by GitHub, outside this file, so a dispatch from any ref other than
  # main never reaches the build. Reviewers live on the environment itself.
  gate:
    needs: [ci, validate]
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: approved
        run: echo "release environment approved"

  build:
    needs: [ci, validate, gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners, no QEMU: aws-lc-sys and SQLite compile C, and
          # emulated compilation is an order of magnitude slower.
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pinned: the action's default is "latest", a binary fetched at run
          # time with packages:write in scope.
          version: v0.38.2

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # One digest per platform; the manifest list is assembled later so a
          # partially pushed release is never visible under a tag.
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=re0auth
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          provenance: mode=max
          sbom: true

      - name: record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          mkdir -p /tmp/digests
          echo "$DIGEST" > "/tmp/digests/$ARCH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build, validate, gate]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ needs.validate.outputs.version }}
      digest: ${{ steps.verify.outputs.digest }}
    permissions:
      # Publishing images needs packages:write; source tags and Releases are
      # created by the separate `release` job, the only one with contents:write.
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.2

      - name: log in
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -eu
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          printf '%s' "$CNB_TOKEN" | docker login docker.cnb.cool -u cnb --password-stdin

      - name: assemble multi-arch manifest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu
          cd /tmp/digests
          # build-push-action already prints sha256:<hex>, so the ref is
          # image@<file contents> verbatim.
          refs=$(for f in *; do printf '%s@%s ' "$GHCR_IMAGE" "$(cat "$f")"; done)
          # A prerelease must not move `latest`; production pulls that tag.
          tags="-t $GHCR_IMAGE:$VERSION"
          case "$VERSION" in
            *-*) ;;
            *) tags="$tags -t $GHCR_IMAGE:latest" ;;
          esac
          docker buildx imagetools create $tags $refs

      - name: copy to CNB
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          # --all keeps the multi-arch manifest intact; --authfile reuses the
          # docker logins above so no token reaches a command line.
          tags="$VERSION"
          case "$VERSION" in
            *-*) ;;
            *) tags="$tags latest" ;;
          esac
          for tag in $tags; do
            skopeo copy --all --authfile "$HOME/.docker/config.json" \
              "docker://$GHCR_IMAGE:$tag" \
              "docker://$CNB_IMAGE:$tag"
          done

      - name: verify both registries
        id: verify
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu
          for image in "$GHCR_IMAGE" "$CNB_IMAGE"; do
            echo "== $image:$VERSION"
            docker buildx imagetools inspect "$image:$VERSION" \
              | grep -E 'Platform|Digest'
          done
          ghcr=$(docker buildx imagetools inspect "$GHCR_IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          cnb=$(docker buildx imagetools inspect "$CNB_IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          if [ "$ghcr" != "$cnb" ]; then
            echo "两家仓库 digest 不一致：$ghcr != $cnb" >&2
            exit 1
          fi
          echo "digest: $ghcr"
          echo "digest=$ghcr" >> "$GITHUB_OUTPUT"

      - name: summary
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 发布 $VERSION

          | 来源 | 拉取命令 |
          | --- | --- |
          | 国内（CNB） | \`docker pull $CNB_IMAGE:$VERSION\` |
          | 国际（GHCR） | \`docker pull $GHCR_IMAGE:$VERSION\` |

          支持 \`linux/amd64\` 与 \`linux/arm64\`，两个仓库内容一致。
          EOF

  # Source tags and Releases are repo content. Kept separate from `publish` so
  # the job that talks to registries never holds contents:write.
  release:
    needs: [publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: create source tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -eu
          if [ -z "$DIGEST" ]; then
            echo "缺少发布的 manifest digest" >&2
            exit 1
          fi

          # Create the tag atomically. If it already exists, it must point at
          # this commit: `--target` is ignored for an existing tag, so never
          # rely on it to decide where the release is attached.
          err=$(mktemp)
          if ! gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$VERSION" -f sha="$GITHUB_SHA" >/dev/null 2>"$err"; then
            if ! grep -q "HTTP 422" "$err"; then
              echo "创建标签失败：" >&2
              cat "$err" >&2
              exit 1
            fi
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" \
              --jq '.object.type + " " + .object.sha')
            object_type=${object%% *}
            object_sha=${object#* }
            if [ "$object_type" = "tag" ]; then
              object_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.object.sha')
            fi
            if [ "$object_sha" != "$GITHUB_SHA" ]; then
              echo "标签 $VERSION 已指向 $object_sha，而本次构建是 $GITHUB_SHA" >&2
              exit 1
            fi
          fi

          {
            echo "## 镜像"
            echo
            echo "| 仓库 | 拉取 |"
            echo "| --- | --- |"
            echo "| 国内（CNB） | \`docker pull $CNB_IMAGE:$VERSION\` |"
            echo "| 国际（GHCR） | \`docker pull $GHCR_IMAGE:$VERSION\` |"
            echo
            echo "manifest digest：\`$DIGEST\`（两个仓库一致，含 linux/amd64 与 linux/arm64）"
            echo
            echo "**提交列表**：https://github.com/$GITHUB_REPOSITORY/commits/$VERSION"
          } > release-notes.md

          if gh release view "$VERSION" >/dev/null 2>&1; then
            # A human may have enriched the notes; never overwrite them on a retry.
            echo "release $VERSION 已存在，保留现有说明"
          else
            # The tag was created (or verified) above, so the release can only
            # attach to this commit.
            gh release create "$VERSION" --verify-tag \
              --title "$VERSION" --notes-file release-notes.md
          fi
