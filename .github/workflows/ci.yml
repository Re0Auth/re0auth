name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Reusable so release.yml can call exactly this workflow instead of a
  # hand-maintained subset. A release that skipped a job here would be a
  # published binary whose checks never ran.
  workflow_call:

permissions:
  contents: read

# Pin the runner image; ubuntu-latest is migrating to Ubuntu 26.
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # rust-embed embeds web/build at compile time. A clean checkout cannot
      # build the workspace until the SPA has been built.
      - name: web assets
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm run build

      # rust-toolchain.toml pins 1.99.1; rustup installs it on first use.
      - name: toolchain
        run: rustup show

      - name: rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: "true"

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --all-targets

      # The dependency firewall and the other machine-checkable invariants.
      # It runs in the normal suite too; this step makes the failure obvious.
      - name: architecture checks
        run: cargo test -p re0auth-archtest -- --nocapture

      # B24: the downstream sample is code too. Its own stdlib stub covers the
      # polling rhythm (pending / slow_down) and both error shapes, so the file a
      # stranger is told to trust cannot rot silently.
      - name: python sample
        run: |
          python3 -m py_compile examples/python/re0auth_bot.py
          python3 -m unittest discover -s examples/python -p 'test_*.py'

      # HR-06 / INV-CONFIG-01: every shipped config is a checked artifact.
      - name: config check
        run: |
          sh tools/check-config.sh config.example.toml
          sh tools/check-config.sh config.docker.toml

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # NODE_ENV=production on a dev machine would omit devDependencies; keep
      # the flag explicit in CI so the build cannot depend on ambient state.
      - name: install
        run: pnpm install --frozen-lockfile

      - name: check
        run: pnpm run check

      - name: build
        run: pnpm run build

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: toolchain
        run: rustup show

      - name: rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: "true"

      - name: web assets
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm run build

      - name: release binary
        run: cargo build --release --locked -p re0auth-server

      - name: browser
        # ubuntu-24.04 already carries Chromium's shared libraries; the missing
        # packages are only optional fonts. `--with-deps` runs apt and turns an
        # unreachable Ubuntu mirror into a failed e2e job, so install the
        # browser archive only and let e2e itself report any real runtime gap.
        run: |
          cd web
          pnpm exec playwright install chromium

      - name: browser e2e
        run: |
          cd web
          pnpm run test:e2e

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A Dockerfile is not accepted until it boots, serves health, and runs
      # without root. This is the anti-rot gate for deployment claims.
      - name: build, boot, and smoke
        run: bash tools/docker-smoke.sh

  semver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: toolchain
        run: rustup show

      - name: rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: "true"

      # The contract crate is the public surface. Breaking changes need a major
      # version and a decision record, not a silent edit.
      - name: install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked --version 0.51.0

      - name: api semver
        run: bash tools/check-semver.sh

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: "true"

      # Bootstrap: pinned to the version verified locally (cargo-deny 0.20.2).
      - name: install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      # cargo-deny covers advisories, licenses, bans, and sources. A second
      # advisory scanner is optional locally, not a second CI gate.
      - name: licenses, advisories, sources
        run: cargo deny check

# Release is intentionally not stubbed here: a skipped check is not a check.
# Frontend checks live in the `web` job above; release digests land separately.
