[workspace]
resolver = "3"
members = [
    "crates/re0auth-api",
    "crates/re0auth-domain",
    "crates/re0auth-app",
    "crates/re0auth-adapters",
    "crates/re0auth-connectors",
    "crates/re0auth-idp",
    "crates/re0auth-runtime",
    "crates/re0auth-http",
    "crates/re0auth-server",
    "crates/re0auth-upstream-kit",
    "crates/re0auth-contract",
    "crates/re0auth-archtest",
]

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Re0Auth/re0auth"

[workspace.dependencies]
aes-gcm = "0.11"
anyhow = "1"
async-trait = "0.1"
aws-lc-rs = "1"
axum = "0.8"
base64 = "0.23"
headers = "0.4"
pem = "3"
percent-encoding = "2.3"
clap = { version = "4.5", features = ["derive", "env"] }
cookie = { version = "0.18", default-features = false, features = ["percent-encode"] }
figment = { version = "0.10", features = ["toml", "env"] }
governor = { version = "0.10", default-features = false, features = ["std", "dashmap"] }
hkdf = "0.13"
hmac = "0.13"
ipnet = "2"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs", "use_pem"] }
mime = "0.3"
maud = "0.27"
mime_guess = "2"
moka = { version = "0.12", default-features = false, features = ["future"] }
oauth2 = { version = "5", default-features = false }
openidconnect = { version = "4", default-features = false }
qrcodegen = "1.8"
getrandom = "0.4"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form"] }
rust-embed = { version = "8", features = ["debug-embed"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-pki-types = "1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "signal"] }
tokio-util = "0.7"
toml = "0.8"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "std"] }
url = "2"
uuid = { version = "1", features = ["v5", "v7", "serde"] }
webpki-roots = "1"
zeroize = "1.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
