# Container configuration. The image writes only under /app/data.
[server]
bind = "0.0.0.0:8080"
issuer = "http://127.0.0.1:8080"
trusted_proxies = []

[database]
url = "sqlite:///app/data/re0auth.db"

# SQLite 调优。省略即用下列默认值。
# synchronous = "normal"
# cache_size_mb = 16
# mmap_size_mb = 64
# pool_size = 5

# [timeouts]
# request_secs = 30
# upstream_secs = 10

[crypto]
master_key_file = "/app/data/keys/master.key"
master_key_version = 1
signing_key_file = "/app/data/keys/signing-key.pem"

[limits]
upstream_response_bytes = 4194304
upstream_inflight_bytes = 67108864
inbound_body_bytes = 1048576

[rate_limit]
unauthenticated_burst = 30
unauthenticated_period_secs = 60
authenticated_burst = 120
authenticated_period_secs = 60
per_user_burst = 60
per_user_period_secs = 60

[cache]
enabled = true
ttl_secs = 300
max_bytes = 8388608

# 超过该天数未刷新即推断凭证失效。
# 不探测上游：上游 TTL 不可知。
[binding_probe]
after_days = 6

# Mozilla trust bundle only; no extra CA, no private-network or loopback exemption.
[tls]
allow_private_net = false
allow_loopback = false
