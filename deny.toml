[graph]
targets = []

[advisories]
version = 2
# A yanked release was withdrawn for a reason. Leaving this at "warn" let tokio
# 1.54.0 (timer use-after-free, ISSUE-0013) sit in the lockfile unnoticed; the
# warning was buried among duplicate-version output that does not fail the run.
yanked = "deny"
# Both advisories describe secret-dependent timing branches in *private key*
# operations. This repository is an OIDC relying party: it only ever builds
# `rsa::RsaPublicKey` / `p256::ecdsa::VerifyingKey` from a JWKS and verifies
# signatures. It never instantiates `CoreRsaPrivateSigningKey`, so no private
# key exists in the process for these branches to leak. No upgrade path exists
# today: `rsa` has `patched = []`, and `crypto-bigint` 0.5.x cannot move to the
# fixed 0.7.6 because `elliptic-curve` 0.13 pins the 0.5 line. Revisit if this
# crate ever signs tokens.
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0387",
]

[licenses]
version = 2
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    # webpki-root-certs ships Mozilla's root store under a permissive data license,
    # pulled in by reqwest's rustls-platform-verifier.
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
